name: Host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Android unit tests and UI compilation
        working-directory: android
        run: ./gradlew --no-daemon -Pkotlin.incremental=false testDebugUnitTest
  native-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pool placement regression tests
        run: bash tests/native/mm/run-pool-boot-test.sh
      - name: Advanced controls and memory tests
        run: bash tests/native/advanced/run.sh
      - name: Whitespace check
        run: git diff --check
