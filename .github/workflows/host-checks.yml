name: Host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pool placement regression tests
        run: bash tests/native/mm/run-pool-boot-test.sh
      - name: Advanced controls and memory tests
        run: bash tests/native/advanced/run.sh
      - name: Whitespace check
        run: git diff --check
